# Render Blueprint: one-click deploy of Toronto Move.
# In Render: New + -> Blueprint -> pick this GitHub repo. Fill in the secret values when asked.
services:
  - type: web
    name: toronto-move
    runtime: node
    plan: starter          # always-on (~US$7/mo). The free plan sleeps, which would stop notifications.
    region: ohio           # closest Render region to Toronto
    # Server packages, then the app's website version (mobile/dist), which the server shows at /
    buildCommand: npm ci --omit=dev && npm --prefix mobile ci && npm --prefix mobile run build:web
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeploy: true       # every push to GitHub redeploys
    disk:
      name: toronto-move-data  # keeps push subscriptions, VAPID keys and the GO fare table across deploys
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: CONTACT         # website or email, sent to Transitous as their usage policy requires
        sync: false
      - key: METROLINX_API_KEY
        sync: false
      - key: AERODATABOX_RAPIDAPI_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY   # optional backup place search (capped inside Google's free amount)
        sync: false
